<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خيرنا | المشتريات</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  background:#f4f7f5;
  color:#173b2a;
}

header{
  background:linear-gradient(135deg,#176b3a,#259653);
  color:white;
  padding:20px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}

.logo{
  font-size:30px;
  font-weight:bold;
}

.logo small{
  display:block;
  font-size:13px;
  margin-top:5px;
  opacity:.9;
}

.back{
  color:white;
  text-decoration:none;
  border:1px solid rgba(255,255,255,.5);
  padding:10px 16px;
  border-radius:10px;
}

.container{
  width:92%;
  max-width:1300px;
  margin:30px auto;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:25px;
}

.page-head h1{
  font-size:27px;
}

.page-head p{
  color:#6c7972;
  margin-top:6px;
}

.primary{
  background:#176b3a;
  color:white;
  border:0;
  padding:13px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin-bottom:25px;
}

.stat{
  background:white;
  padding:20px;
  border-radius:15px;
  border:1px solid #e1e8e3;
}

.stat span{
  color:#718078;
  font-size:13px;
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:8px;
}

.form-box{
  display:none;
  background:white;
  padding:25px;
  border-radius:18px;
  border:1px solid #e1e8e3;
  margin-bottom:25px;
}

.form-box.active{
  display:block;
}

.form-title{
  font-size:21px;
  margin-bottom:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.field label{
  display:block;
  font-size:13px;
  margin-bottom:7px;
  font-weight:bold;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:12px;
  border:1px solid #d8e1db;
  border-radius:9px;
  outline:none;
  background:#fafcfb;
}

.field input:focus,
.field select:focus{
  border-color:#259653;
}

.field textarea{
  min-height:80px;
  resize:vertical;
}

.total{
  background:#e9f7ef;
  border-radius:9px;
  padding:12px;
  font-weight:bold;
  color:#176b3a;
}

.form-actions{
  margin-top:20px;
  display:flex;
  gap:10px;
}

.cancel{
  background:#eef1ef;
  border:0;
  padding:12px 20px;
  border-radius:9px;
  cursor:pointer;
}

.table-box{
  background:white;
  border-radius:18px;
  border:1px solid #e1e8e3;
  overflow:hidden;
}

.table-head{
  padding:20px;
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}

.search{
  padding:11px 14px;
  border:1px solid #d8e1db;
  border-radius:9px;
  min-width:250px;
}

.table-wrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:1000px;
}

th,td{
  padding:14px 12px;
  text-align:right;
  border-top:1px solid #edf1ee;
  font-size:13px;
}

th{
  background:#f7faf8;
  color:#52645a;
}

.empty{
  text-align:center;
  padding:45px;
  color:#7b8780;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  background:#e9f7ef;
  color:#176b3a;
  font-size:12px;
}

footer{
  text-align:center;
  padding:30px;
  color:#7b8780;
}

@media(max-width:900px){
  .form-grid{
    grid-template-columns:repeat(2,1
